name: Update RSS

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Test event page
        run: |
          python - <<'PY'
          import requests

          url = "https://www.convex-okayama.co.jp/event/"
          r = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=30
          )

          print("HTTP:", r.status_code)
          print("Length:", len(r.text))
          print("URL:", r.url)
          PY
